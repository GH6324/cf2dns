<style>
    .SetAggregateOne p {
        margin-top: 15px;
    }
    .SetAggregateOne p span {
        margin-right: 15px;
        display: inline-block;
        width: 80px;
        text-align: right;
    }
    .SetAggregateOne p input {
        height: 30px;
        width: 240px;
        padding-left: 10px;
        font-size: 13px;
    }
    .SetAggregateOne p select {
        height: 30px;
        width: 240px;
        padding-left: 10px;
        font-size: 13px;
    }

</style>
<div class="bt-form">
    <div class="bt-w-main">
        <!--菜单部分，data-page 与 static/pages/<id>.html 同名-->
        <div class="bt-w-menu">
            <p data-page="overview"   onclick="cf2dns.show_page('overview')">概览</p>
            <p data-page="home"       onclick="cf2dns.show_page('home')">解析配置</p>
            <p data-page="domain"     onclick="cf2dns.show_page('domain')">域名管理</p>
            <p data-page="dataserver" onclick="cf2dns.show_page('dataserver')">数据服务</p>
            <p data-page="crontab"    onclick="cf2dns.show_page('crontab')">计划任务</p>
        </div>
        <!--内容部分，子页面注入到这里-->
        <div class="bt-w-con pd15">
            <div class="plugin_body"></div>
        </div>
    </div>
</div>

<script type="text/javascript">

    //定义窗口尺寸
    $('.layui-layer-page').css({ 'width': '900px' });

    //=====================================================================
    //  框架入口：只负责样式、菜单、路由、请求与跨页共享数据
    //  各页面的界面与逻辑在 static/pages/<id>.html 里，由 show_page 动态加载
    //=====================================================================
    var cf2dns = {
        //子页面注册表，pages/<id>.html 被注入时把自己挂到 cf2dns.pages.<id>
        pages: {},
        //子页面 HTML 缓存，面板页面刷新即失效
        page_cache: {},
        current_page: '',
        //layer 加载提示的句柄，各页面保存/删除时共用
        loading: null,

        //----------------------------- 工具 -----------------------------
        //HTML转义，JSON中的数据拼接进模板前统一处理，避免引号或标签破坏页面结构
        esc: function (value) {
            if (value === undefined || value === null) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        },
        //用于拼接进 onclick 的域名与主机名，配合 decodeURIComponent 还原
        enattr: function (value) {
            if (value === undefined || value === null) return '';
            return encodeURIComponent(String(value)).replace(/'/g, '%27');
        },
        //接口返回未登录时的统一提示，由 send_request 集中处理，页面不必各自判断
        render_denied: function (res) {
            $(".plugin_body").html('<div class="c7 mtb15">' + cf2dns.esc((res && res.msg) || '未登录') + '，请重新登录面板后刷新本页。</div>');
        },
        //异步回调回来时用户可能已经切走了，此时不能再动 .plugin_body，否则会把当前页面冲掉
        is_current: function (id) {
            return cf2dns.current_page === id;
        },

        //------------------------- 跨页共享数据 -------------------------
        plugin_info_cache: null,
        home_cache: null,
        //获取插件信息（info.json + about.json），概览页与计划任务页共用
        plugin_info: function (callback, fail) {
            if (cf2dns.plugin_info_cache) {
                callback(cf2dns.plugin_info_cache);
                return;
            }
            cf2dns.send_request('get_plugin_info', 'get', {}, function (res) {
                cf2dns.plugin_info_cache = res.data || {};
                callback(cf2dns.plugin_info_cache);
            }, 100000, function () {
                if (fail) fail();
            });
        },
        //获取线路定义，未访问过解析配置页时自动拉取一次
        get_lines: function (callback, fail) {
            if (cf2dns.home_cache) {
                callback(cf2dns.home_cache.lines || []);
                return;
            }
            cf2dns.send_request('get_home_info', 'get', {}, function (res) {
                var data = res.data || {};
                cf2dns.home_cache = {
                    config: data.config || {},
                    providers: data.dns_providers || [],
                    lines: data.lines || []
                };
                callback(cf2dns.home_cache.lines);
            }, 100000, function () {
                if (fail) fail();
            });
        },
        //默认线路文本，取自 lines.json 中 default 为 true 的项
        default_line_text: function (lines) {
            var codes = (lines || []).filter(function (item) {
                return item['default'];
            }).map(function (item) {
                return item.code;
            });
            if (!codes.length) codes = ['CM', 'CU', 'CT'];
            return codes.join(',');
        },

        //----------------------------- 路由 -----------------------------
        //取子页面 HTML。走面板的插件静态目录 /<插件名>/static/<路径>
        load_page: function (id, ok, fail) {
            if (cf2dns.page_cache[id]) {
                ok(cf2dns.page_cache[id]);
                return;
            }
            $.ajax({
                url: '/cf2dns/static/pages/' + id + '.html?t=' + Date.now(),
                type: 'get',
                dataType: 'html',
                timeout: 100000,
                success: function (html) {
                    cf2dns.page_cache[id] = html;
                    ok(html);
                },
                error: function () { fail(); }
            });
        },
        //切换子页面。注入 HTML 后 jQuery 会同步执行片段内的 <script>，
        //子页面在那一刻完成注册，随后调它的 init()
        show_page: function (id) {
            cf2dns.current_page = id;
            $(".bt-w-menu p").removeClass('bgw').filter("[data-page='" + id + "']").addClass('bgw');
            $(".plugin_body").html('<div class="c7 mtb15">加载中...</div>');
            cf2dns.load_page(id, function (html) {
                //用户在加载期间切走了就不要再渲染，否则会覆盖新页面
                if (!cf2dns.is_current(id)) return;
                $(".plugin_body").html(html);
                var page = cf2dns.pages[id];
                if (page && page.init) {
                    //init 抛异常时页面会停在骨架上且无任何提示，这里兜住并显示出来
                    try {
                        page.init();
                    } catch (e) {
                        $(".plugin_body").html('<div class="c7 mtb15">页面 ' + cf2dns.esc(id) + ' 初始化失败：' + cf2dns.esc(e && e.message) + '</div>');
                    }
                } else {
                    $(".plugin_body").html('<div class="c7 mtb15">页面 ' + cf2dns.esc(id) + ' 未注册 cf2dns.pages.' + cf2dns.esc(id) + '</div>');
                }
            }, function () {
                if (!cf2dns.is_current(id)) return;
                $(".plugin_body").html('<div class="c7 mtb15">页面加载失败：static/pages/' + cf2dns.esc(id) + '.html</div>');
            });
        },

        //----------------------------- 请求 -----------------------------
        //data.error 是客户端标志：true 表示由调用方自行提示错误，不弹通用提示。
        //它只作用于前端，发送前会被剔除，不会当成表单字段发给后端。
        //401 在这里统一拦截，所有接口（含写接口）都能拿到一致的未登录提示
        send_request: function (api, type, data, success, timeout, error) {
            var payload = $.extend({}, data || {});
            var silent = payload.error === true;
            delete payload.error;
            $.ajax({
                url: '/cf2dns/' + api + ".json?t=" + Date.now(),
                type: type,
                data: payload,
                timeout: timeout || 100000,
                success: function (res) {
                    if (res && res.code === 401) { cf2dns.render_denied(res); return; }
                    success(res);
                },
                error: function (err) {
                    if (error) { error(err); return; }
                    if (!silent) layer.msg('请求接口[' + cf2dns.esc(api) + ']出错', { icon: 5, time: 1500 });
                }
            });
        }
    };

    cf2dns.show_page('overview');
</script>
